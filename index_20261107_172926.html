'use strict';const A='٠١٢٣٤٥٦٧٨٩',names=['الآحاد','العشرات','المئات','الآلاف'],factors=[1,10,100,1000];const ar=n=>String(n).replace(/\d/g,d=>A[+d]);const en=s=>String(s).replace(/[٠-٩]/g,d=>String(A.indexOf(d))).replace(/[۰-۹]/g,d=>String('۰۱۲۳۴۵۶۷۸۹'.indexOf(d)));const numberDigits=n=>[n%10,Math.floor(n/10)%10,Math.floor(n/100)%10,Math.floor(n/1000)%10];const expanded=n=>numberDigits(n).map((d,i)=>ar(d*factors[i])).join(' + ');const validateExp=(v,n)=>{const vals=en(v).replace(/[＋﹢]/g,'+').split('+').map(x=>x.trim().replace(/\s/g,''));const target=numberDigits(n).map((d,i)=>String(d*factors[i]));return vals.length===4&&vals.every((x,i)=>/^\d+$/.test(x)&&Number(x)===Number(target[i]));};const orderNote='<div class="hint">✍️ اكتب الصيغة من <b>اليمين إلى اليسار</b>: الآحاد ← العشرات ← المئات ← الآلاف، واكتب <b>٠</b> لأي منزلة صفرية. مثال: <span dir="rtl" class="exptext">٦ + ٠ + ٤٠٠ + ٢٠٠٠</span></div>';const get=(id)=>document.getElementById(id), show=(html)=>{get('app').innerHTML=html;window.scrollTo({top:0,behavior:'smooth'});updateKeys()};function toast(s){let t=get('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2500)};
let state={keys:[false,false,false,false],gate:0,sub:'',mat:[null,null,null,null],selected:0,groups:[{n:2406,counts:[0,0,0,0],exp:'',passed:false},{n:3052,counts:[0,0,0,0],exp:'',passed:false}],peer:[false,false,false,false],peerDone:false,individual:{},self:'',student:'',final:false};try{let saved=localStorage.getItem('nizwaAdventureV5');if(saved){let p=JSON.parse(saved);if(p.keys?.length===4)state={...state,...p}}}catch(e){}function save(){try{localStorage.setItem('nizwaAdventureV5',JSON.stringify(state))}catch(e){}}function updateKeys(){const k=get('keybar');k.innerHTML=state.keys.map((v,i)=>`<span class="key ${v?'earned':''}" title="مفتاح ${ar(i+1)}">${v?'🔑':'🔒'}</span>`).join('');save()}const scenic=`<svg class="scene" viewBox="0 0 1200 330" preserveAspectRatio="xMidYMax slice" aria-hidden="true"><path d="M0 240 Q130 160 230 245 Q340 130 450 230 Q640 160 760 240 Q920 175 1200 230 V330 H0" fill="#d6d7bc"/><path d="M0 275 Q250 232 440 288 Q790 235 1200 272 V330 H0" fill="#b7cdb4"/><g fill="#c4a47f" stroke="#967351" stroke-width="3"><path d="M790 290V145h55v-25h65v25h50v145z"/><path d="M855 290V85h165v205z"/><path d="M850 85l20-18 18 18 20-18 18 18 20-18 18 18 20-18 18 18"/><path d="M1030 290V185h130v105z"/></g><g fill="#805b43"><path d="M909 290v-63a28 28 0 0156 0v63"/><rect x="1033" y="212" width="18" height="34" rx="8"/><rect x="1096" y="212" width="18" height="34" rx="8"/></g><g stroke="#7a6d4c" stroke-width="8"><path d="M120 300L130 190M245 305L250 230M1110 305L1125 188"/></g><g fill="#3e8062"><path d="M130 187q-95-50-113 0 71-12 113 0zm0 0q-17-90-62-95 8 73 62 95zm0 0q12-90 70-100-10 63-70 100zm0 0q76-39 100 13-54-7-100-13z"/><path d="M1125 188q-95-45-115-4 72-10 115 4zm0 0q-20-77-68-92 10 68 68 92zm0 0q18-81 75-90-10 55-75 90z"/></g><path d="M0 310Q300 285 600 307T1200 306V330H0" fill="#b5a77a"/></svg>`;
const button=(text,fun,cls='')=>`<button class="button ${cls}" onclick="${fun}">${text}</button>`;const panel=(title,content)=>`<section class="panel"><h2 class="title">${title}</h2>${content}</section>`;const placeGrid=(n)=>`<div class="places">${names.map((name,i)=>`<div class="place"><b>${name}</b><strong>${ar(numberDigits(n)[i])}</strong><small>${ar(numberDigits(n)[i]*factors[i])}</small></div>`).join('')}</div>`;const nav=(label='العودة إلى خريطة القلعة')=>`<div class="navigator">${button('🏰 '+label,'home()','outline')}<span class="badge">المفاتيح: ${ar(state.keys.filter(Boolean).length)} من ٤</span></div>`;
function home(){state.gate=0;show(`<div class="hero">${scenic}<div class="hero-text"><span class="tag">🏰 مغامرة تعليمية في سلطنة عُمان</span><h1>مغامرة أسرار الأعداد<br>في قلعة نزوى</h1><p>أربع بوابات، أربع مفاتيح، وكنز ينتظر الأبطال!</p>${button('✉️ رسالة حارس القلعة','letter()','secondary')}</div></div>${panel('خريطة البوابات الأربع',`<p class="sub">اختر البوابة المفتوحة، أنجز المهمة ثم حلّ سؤال الإتقان الفردي لتحصل على مفتاحها.</p><div class="grid g4">${['🧱|ساحة البنّائين|المكعبات وبساط المنازل','📱|برج الأعداد|مختبر الآيباد وتقويم الأقران','🔦|غرفة الشفرات|الكشف الضوئي وتصحيح الخطأ','🏛️|مجلس حراس القلعة|الهوية والتقويم الختامي'].map((x,i)=>{let p=x.split('|'),open=i===0||state.keys[i-1];return `<div class="gate ${state.keys[i]?'done':!open?'locked':''}"><span class="number">البوابة ${ar(i+1)}</span><div class="emoji">${p[0]}</div><h3>${p[1]}</h3><small>${p[2]}</small>${button(state.keys[i]?'✅ مراجعة':open?'ادخل البوابة':'🔒 مغلقة',`gate(${i})`,'mini '+(!open?'outline':''))}</div>`}).join('')}</div><div class="progress"><i style="width:${state.keys.filter(Boolean).length*25}%"></i></div>`) }${panel('بعد فتح البوابات',`<div class="row">${button('🎁 صندوق الكنز','treasure()',state.keys.every(Boolean)?'secondary':'outline')}${button('📝 واجب من حياتنا – بطاقة A6','homework()','outline')}${button('📋 سجل تقويم المعلمة','record()','outline')}</div>`)}`)}
function letter(){show(`${nav()}${panel('✉️ رسالة من حارس قلعة نزوى',`<div class="speech"><b>السلام عليكم يا أبطال الرياضيات!</b><p>أنا حارس قلعة نزوى، أحرس أسرار هذه القلعة العريقة وكنوزها. لكنني اليوم أواجه مشكلة عجيبة! لقد أُغلقت بوابة الكنز بأربعة أقفال، ولن تُفتح إلا لمن يعرف أسرار الآحاد والعشرات والمئات والآلاف.</p><p>في كل بوابة مهمة جديدة: سنبني الأعداد، ونكتشف قيمة كل رقم، ونفك الشفرات، ونكتب الصيغة التحليلية.</p><b>هل أنتم مستعدون لمساعدتي؟ هيا يا أبطال… القلعة تنتظركم! 🗝️</b></div><p class="hint">🎯 هدف المغامرة: تمييز المنازل وكتابة الصيغة التحليلية للأعداد من ثلاث أو أربع منازل.</p>${button('🚪 انطلق إلى البوابة الأولى','gate(0)')}`)}`)}
function gate(i){if(i>0&&!state.keys[i-1]){toast('افتح البوابة السابقة أولًا');return}state.gate=i;state.sub='activity';if(i===0)gate1();if(i===1)gate2();if(i===2)gate3();if(i===3)gate4()}
function gate1(){show(`${nav()}${panel('🧱 البوابة الأولى: ساحة البنّائين',`<div class="speech">يا أبطال! فقدت أرقام العدد <b>٢٤٣٦</b> منازلها. ساعدوني في إعادتها إلى بساط المنازل، ثم مثّلوها بمكعبات الأساس العشرة.</div><div class="hint">👣 نشاط بساط المنازل: اختَر بطاقة رقم، ثم اضغط على المنزلة الصحيحة لتضع الرقم فيها. على البساط الحقيقي يحمل التلميذ البطاقة ويقف في مكانها.</div><div class="cards">${[2,4,3,6].map((n,i)=>`<button class="cardnum ${state.selected===i?'selected':''}" onclick="chooseDigit(${i})">${ar(n)}</button>`).join('')}</div><p class="sub" style="text-align:center">البطاقة المختارة: <b>${ar([2,4,3,6][state.selected])}</b></p><div class="floor">${names.map((name,i)=>`<button onclick="putDigit(${i})"><span>${name}</span><strong>${state.mat[i]===null?'؟':ar(state.mat[i])}</strong><em>👣</em></button>`).join('')}</div><div class="row" style="margin-top:17px">${button('تحقّق من ترتيب العدد','checkMat()')}${button('امسح البساط','clearMat()','outline')}</div><div id="matmsg"></div><div class="teacher-actions">${button('👁️ إظهار الإجابة – المحطة الأولى','revealGate1()','secondary mini')}</div><div id="reveal1"></div><details class="teacher"><summary>إرشاد للمعلمة: المحسوس والحركة</summary><p>ابدئي بمكعب آحاد، قضيب عشرات، لوح مئات، مكعب آلاف. ثم نفذي بساط المنازل الحركي: ٢ في الآلاف، ٤ في المئات، ٣ في العشرات، ٦ في الآحاد. راقبي كل تلميذ على حدة.</p></details>`)}`)}
function chooseDigit(i){state.selected=i;gate1()}function putDigit(i){let n=[2,4,3,6][state.selected];state.mat=state.mat.map(x=>x===n?null:x);state.mat[i]=n;gate1()}function clearMat(){state.mat=[null,null,null,null];gate1()}function checkMat(){const good=state.mat.every((x,i)=>x===numberDigits(2436)[i]);get('matmsg').innerHTML=`<div class="notice ${good?'':'bad'}">${good?'✅ أحسنتم! ٢٤٣٦ = ٦ + ٣٠ + ٤٠٠ + ٢٠٠٠':'🔎 راجع ترتيب المنازل: الآحاد ثم العشرات ثم المئات ثم الآلاف.'}</div>${good?button('🔑 سؤال المفتاح الفردي الأول','miniCheck(0)'):''}`}
function revealGate1(){get('reveal1').innerHTML=`<div class="reveal-answer"><b>✅ الإجابة النموذجية – ساحة البنّائين</b><div class="floor">${names.map((x,i)=>`<div style="background:white;padding:9px;border-radius:12px;border:1px solid #ddd"><small>${x}</small><strong style="display:block;font-size:28px">${ar(numberDigits(2436)[i])}</strong></div>`).join('')}</div><span class="answer-math">٦ + ٣٠ + ٤٠٠ + ٢٠٠٠</span><div class="answer-note">ناقشوا: ما منزلة الرقم ٤؟ وما قيمته؟</div>${button('🔑 سؤال المفتاح الفردي الأول','miniCheck(0)','mini')}</div>`}
function gate2(){show(`${nav()}${panel('📱 البوابة الثانية: برج الأعداد السحري',`<div class="speech">أمامكم شفرتان! <b>مجموعة البنات</b> لديها صفر في منزلة العشرات، و<b>مجموعة الأولاد</b> لديها صفر في منزلة المئات. لكل مجموعة آيباد، ومهمتكم تكوين العدد بمواد الأساس الافتراضية ثم كتابة الصيغة التحليلية.</div><div class="hint">👥 الأدوار: مهندس البناء يضيف القطع، وكاتب الشفرة يكتب الصيغة، ومكتشف الأسرار يراجع قيمة الصفر. بعد انتهاء المهمة تبادلوا الأدوار في المراجعة.</div><div class="grid g2">${[0,1].map(groupHtml).join('')}</div><div class="teacher-actions">${button('👁️ إظهار إجابتي المجموعتين','revealBothGroups()','secondary')}</div><div id="gatemsg"></div>${state.groups.every(g=>g.passed)?`<div class="notice">✅ الفريقان أنهيا مهمتيهما. الآن تبادلا الآيباد أو اعرضا النتيجتين لتقويم الأقران.</div>${peerHtml()}`:''}<details class="teacher"><summary>إرشاد للمعلمة: تمايز وتقويم أقران</summary><p>البنات: ٢٤٠٦ = ٦ + ٠ + ٤٠٠ + ٢٠٠٠. الأولاد: ٣٠٥٢ = ٢ + ٥٠ + ٠ + ٣٠٠٠. سجلي مستوى مشاركة كل واحد من الطلاب الستة؛ فالنجاح الجماعي لا يكفي لتقييم الإتقان الفردي.</p></details>`)}`)}
function groupHtml(i){let g=state.groups[i];return `<div class="group"><h3>${i===0?'👧🏻 مجموعة البنات':'👦🏻 مجموعة الأولاد'}</h3><div class="numberbig">${ar(g.n)}</div><p>كوّنوا العدد من قطع الآلاف والمئات والعشرات والآحاد.</p><div class="model">${[0,1,2,3].map(k=>`<div class="blockbox"><small>${names[k]}</small><div class="count">${ar(g.counts[k])}</div><div class="cube">${['■','▦','▮','●'][k].repeat(g.counts[k])||'—'}</div><button aria-label="إضافة ${names[k]}" onclick="changeCount(${i},${k},1)">+</button><button aria-label="حذف ${names[k]}" onclick="changeCount(${i},${k},-1)">−</button></div>`).join('')}</div><p><b>الصيغة التحليلية:</b></p>${orderNote}<input dir="rtl" id="exp${i}" class="field" placeholder="٦ + ٠ + ٤٠٠ + ٢٠٠٠" value="${escapeHTML(g.exp)}" oninput="state.groups[${i}].exp=this.value;save()"><p>${button('تحقق من شفرة المجموعة',`checkGroup(${i})`,'mini')} ${button('👁️ إظهار الإجابة',`revealGroup(${i})`,'secondary mini')} ${g.passed?'✅ تم الإتقان':''}</p><div id="answerGroup${i}"></div></div>`}
function revealGroup(i){const g=state.groups[i],n=g.n;g.passed=true;const box=get('answerGroup'+i);box.innerHTML=`<div class="reveal-answer"><b>✅ الإجابة النموذجية – ${i===0?'مجموعة البنات':'مجموعة الأولاد'}</b><div class="answer-math">${expanded(n)}</div><p>الآحاد: ${ar(numberDigits(n)[0])} | العشرات: ${ar(numberDigits(n)[1])} | المئات: ${ar(numberDigits(n)[2])} | الآلاف: ${ar(numberDigits(n)[3])}</p><div class="answer-note">المنازل ذات الصفر لا نضع فيها قطعًا، ونكتب ٠ في الصيغة التحليلية.</div></div>`;save();if(state.groups.every(g=>g.passed)){get('gatemsg').innerHTML=`<div class="notice">✅ ظهرت الإجابتان. ناقشوا الفروق بين الصفر في العشرات والصفر في المئات.</div>${peerHtml()}`}}
function revealBothGroups(){revealGroup(0);revealGroup(1)}
function changeCount(i,k,delta){state.groups[i].counts[k]=Math.max(0,Math.min(9,state.groups[i].counts[k]+delta));gate2()}function checkGroup(i){let g=state.groups[i],correct=numberDigits(g.n).every((d,k)=>d===g.counts[k])&&validateExp(g.exp,g.n);g.passed=correct;gate2();get('gatemsg').innerHTML=`<div class="notice ${correct?'':'bad'}">${correct?'✅ ممتاز! المواد والصيغة التحليلية صحيحتان.':'🔎 يحتاج تمثيل المجموعة أو الصيغة التحليلية إلى مراجعة. تحققوا من موضع الصفر.'}</div>`}
function peerHtml(){return `<div class="panel" style="box-shadow:none;border-color:#b7d5bc"><h3 class="title">🤝 حراس الشفرات: تقويم الأقران</h3><p>بعد تبادل النتائج، راجعوا عمل المجموعة الأخرى بأمانة.</p>${['تمثيل العدد بقطع الأساس صحيح','المنزلة التي تحتوي على الصفر خالية من القطع','الصيغة التحليلية تبدأ بالآحاد وتتضمن قيم الأصفار','فسّرت المجموعة دور الصفر في الحفاظ على مواضع الأرقام'].map((s,i)=>`<label class="opt" style="margin:8px 0"><input type="checkbox" ${state.peer[i]?'checked':''} onchange="state.peer[${i}]=this.checked;save()">${s}</label>`).join('')}<div class="row">${button('اعتماد تقويم الأقران','finishPeer()')}${state.peerDone?button('🔑 سؤال المفتاح الفردي الثاني','miniCheck(1)'):''}</div></div>`}function finishPeer(){if(!state.peer.every(Boolean)){toast('راجعي المعايير مع المجموعتين أولًا');return}state.peerDone=true;gate2();toast('أحسنتم! تم تقويم الأقران')}
function gate3(){show(`${nav()}${panel('🔦 البوابة الثالثة: غرفة الشفرات المضيئة',`<div class="speech">وجدت رسالة ضوئية داخل القلعة! اكشفوا العدد المخفي، ثم اكتبوا الصيغة التحليلية. بعد ذلك اكتشفوا خطأ الحارس.</div><p class="sub">اضغط على المصباح لإظهار الشفرة:</p><div id="lamp" class="light hidden"><div class="secret">٣٤٠٧</div></div><p>${button('🔦 شغّل المصباح','toggleLamp()')}</p><p>الصيغة التحليلية للعدد المكتشف:</p>${orderNote}<input dir="rtl" id="secretExp" class="field short" placeholder="اكتب القيم مفصولة بعلامة +"><p>${button('افحص الشفرة','checkSecret()','mini')}</p><div id="secretMsg"></div><hr style="border:0;border-top:1px solid #e6dac7;margin:26px 0"><h3>🕵️ اكتشف خطأ الحارس</h3><p>كتب الحارس للعدد <b>٢٥٣٦</b> الصيغة الآتية:</p><div class="numberbig" style="font-size:clamp(21px,4vw,40px)">٦ + ٣ + ٥٠٠ + ٢٠٠٠</div><p>ما القيمة التي يجب أن تحل محل ٣؟</p><div class="row"><input id="mistake" class="field short" placeholder="اكتب القيمة الصحيحة">${button('تحقق من التصحيح','checkMistake()','mini')}</div><div id="mistakeMsg"></div><div id="gate3next"></div><div class="teacher-actions">${button('👁️ إظهار إجابتي محطة الشفرات','revealGate3()','secondary')}</div><div id="reveal3"></div><details class="teacher"><summary>إرشاد للمعلمة: الشفرة الضوئية</summary><p>يمكن استخدام الورقة والإضاءة الحقيقية بالتوازي مع الكشف الإلكتروني. الصيغة الصحيحة: ٣٤٠٧ = ٧ + ٠ + ٤٠٠ + ٣٠٠٠. والخطأ في شفرة ٢٥٣٦ هو كتابة ٣ بدلًا من ٣٠.</p></details>`)}`)}let secretOK=false,mistakeOK=false;function toggleLamp(){get('lamp').classList.toggle('hidden')}function checkSecret(){secretOK=validateExp(get('secretExp').value,3407);get('secretMsg').innerHTML=`<div class="notice ${secretOK?'':'bad'}">${secretOK?'✅ فككت الشفرة بنجاح!':'🔎 راجع ترتيب القيم من الآحاد إلى الآلاف، واكتب ٠ في منزلة العشرات.'}</div>`;gate3finish()}function checkMistake(){mistakeOK=en(get('mistake').value.trim())==='30';get('mistakeMsg').innerHTML=`<div class="notice ${mistakeOK?'':'bad'}">${mistakeOK?'✅ صحيح، قيمة ٣ في العشرات تساوي ٣٠.':'🔎 الرقم ٣ يقع في العشرات، فما قيمته؟'}</div>`;gate3finish()}function gate3finish(){if(secretOK&&mistakeOK)get('gate3next').innerHTML=button('🔑 سؤال المفتاح الفردي الثالث','miniCheck(2)')}
function revealGate3(){secretOK=true;mistakeOK=true;get('reveal3').innerHTML=`<div class="reveal-answer"><b>✅ الإجابة النموذجية للشفرة</b><div class="answer-math">${expanded(3407)}</div><b>✅ تصحيح خطأ الحارس</b><div class="answer-math">٣٠ بدلًا من ٣</div><div class="answer-note">قيمة الرقم ٣ في العدد ٢٥٣٦ هي ٣٠ لأنه في العشرات.</div></div>`;gate3finish()}
function gate4(){show(`${nav()}${panel('🏛️ البوابة الرابعة: مجلس حراس القلعة',`<div class="speech">نحن الآن داخل مجلس حراس قلعة نزوى! لنعتز بتراث عُمان، ونتعاون ونحافظ على الأدوات. أمامك رمز بوابة التراث العُماني. هل تستطيع تحليله بمفردك؟</div><div class="tag">🇴🇲 من هويتنا: قلعة نزوى من معالم سلطنة عُمان</div><p class="sub">رتّب العدد على لوحة المنازل، واكتب صيغته التحليلية.</p><div class="numberbig">٤٠٥٢</div>${placeGrid(4052)}<p><b>اكتب الصيغة التحليلية:</b></p>${orderNote}<div class="row"><input dir="rtl" id="gate4exp" class="field short" placeholder="الصيغة التحليلية">${button('تحقق من الرمز','checkGate4()','mini')}</div><div id="gate4msg"></div><div id="gate4next"></div><div class="teacher-actions">${button('👁️ إظهار الإجابة – المحطة الرابعة','revealGate4()','secondary')}</div><div id="reveal4"></div><div class="hint">💚 ناقشوا: كيف نحافظ على القلاع والمباني التراثية في عُمان؟ واستمعوا لإجابة كل زميل باحترام.</div>`)}`)}function checkGate4(){let ok=validateExp(get('gate4exp').value,4052);get('gate4msg').innerHTML=`<div class="notice ${ok?'':'bad'}">${ok?'✅ حُل رمز التراث بنجاح!':'🔎 يوجد صفر في المئات؛ اكتب ٠ بين قيمة العشرات وقيمة الآلاف.'}</div>`;if(ok)get('gate4next').innerHTML=button('🔑 سؤال المفتاح الفردي الرابع','miniCheck(3)')}
function revealGate4(){get('reveal4').innerHTML=`<div class="reveal-answer"><b>✅ الإجابة النموذجية – مجلس الحراس</b><span class="answer-math">${expanded(4052)}</span><div class="answer-note">القيمة الصفرية في المئات تكتب ٠.</div></div>`;get('gate4next').innerHTML=button('🔑 سؤال المفتاح الفردي الرابع','miniCheck(3)')}
const minis=[{n:1,title:'مفتاح المنازل',q:'ما منزلة الرقم ٤ في العدد ٢٤٣٦؟',opts:['الآحاد','العشرات','المئات','الآلاف'],correct:'المئات'},{n:2,title:'مفتاح قيمة الرقم',q:'ما قيمة الرقم ٥ في العدد ٣٠٥٢؟',opts:['٥','٥٠','٥٠٠','٥٠٠٠'],correct:'٥٠'},{n:3,title:'مفتاح تصحيح الخطأ',q:'في العدد ٣٢١٤، كتب الحارس قيمة الرقم ١ على أنها ١. ما قيمتها الصحيحة؟',opts:['١','١٠','١٠٠','١٠٠٠'],correct:'١٠'},{n:4,title:'مفتاح الصيغة التحليلية',q:'أي صيغة تحليلية صحيحة للعدد ٤٠٧٢، من الآحاد إلى الآلاف مع كتابة الصفر؟',opts:['٢ + ٧٠ + ٠ + ٤٠٠٠','٢ + ٧٠ + ٠ + ٤٠٠','٢ + ٧٠٠ + ٠ + ٤٠٠٠','٢ + ٧ + ٠ + ٤٠٠٠'],correct:'٢ + ٧٠ + ٠ + ٤٠٠٠'}];let selectedMini='';function miniCheck(i){selectedMini='';const m=minis[i];show(`${nav()}${panel(`🔑 سؤال الإتقان الفردي ${ar(i+1)}: ${m.title}`,`<div class="hint">🤫 مهمة فردية: يجيب كل تلميذ بمفرده على بطاقته، ثم تُسجّل المعلمة مستوى استقلاليته. السؤال الظاهر على الشاشة مخصص للتقويم، وليس لإجابة المجموعة.</div><div class="speech"><b>${m.q}</b></div><div class="grid g2" style="margin-top:17px">${m.opts.map((o,j)=>`<button id="option${j}" class="opt" onclick="selectMini(${i},'${o.replace(/'/g,"\\'")}',${j})" style="font-size:21px;font-weight:bold">${o}</button>`).join('')}</div><p id="miniresult"></p><div class="teacher-actions">${button('👁️ إظهار الإجابة الفردية',`revealMini(${i})`,'secondary mini')}</div><div id="miniReveal"></div><div id="mininext"></div><details class="teacher"><summary>إرشاد للمعلمة: تسجيل الأداء الفردي</summary><p>لا تكتفي بإجابة طالب واحد أمام الصف. يجيب الطلاب الستة على بطاقات منفصلة، ثم سجلي الأداء في «سجل تقويم المعلمة». اختاري: مستقل، بمساعدة، يحتاج إلى تدريب.</p>${button('📋 افتح سجل تقويم المعلمة','record()','outline mini')}</details>`)}`)}function revealMini(i){const m=minis[i];get('miniReveal').innerHTML=`<div class="reveal-answer"><b>✅ الإجابة النموذجية</b><span class="answer-math">${m.correct}</span><div class="answer-note">اعرضي الإجابة بعد أن يجيب جميع التلاميذ، وسجلي مستوى الإتقان الفردي قبل الانتقال.</div></div>`;get('mininext').innerHTML=`<div class="row">${button('🔑 متابعة المغامرة بعد المناقشة',`teacherAdvance(${i})`,'secondary')}${button('📋 سجل تقويم المعلمة','record()','outline mini')}</div>`}
function teacherAdvance(i){state.keys[i]=true;save();updateKeys();if(i===3)treasure();else gate(i+1)}
function selectMini(i,o,j){selectedMini=o;const correct=o===minis[i].correct;get('miniresult').innerHTML=`<div class="notice ${correct?'':'bad'}">${correct?'✅ رائع! لقد حُلّ سؤال المفتاح.':'🔎 راجع المنزلة وقيمة الرقم وحاول مرة أخرى.'}</div>`;if(correct){state.keys[i]=true;save();updateKeys();get('mininext').innerHTML=`<div class="success"><div class="giant">🔑</div><h2>حصلنا على المفتاح ${ar(i+1)}!</h2>${button(i===3?'🎁 إلى صندوق الكنز':`🚪 البوابة ${ar(i+2)}`,i===3?'treasure()':`gate(${i+1})`,'secondary')} ${button('خريطة القلعة','home()','outline')}</div>`}}function treasure(){if(!state.keys.every(Boolean)){toast('اجمع المفاتيح الأربعة أولًا');home();return}show(`${nav()}${panel('🎁 الكنز الأخير في قلعة نزوى',`<div class="success"><div class="giant">🏆🔑🎁</div><h2 class="title">فتحتم صندوق الكنز!</h2><p style="font-size:23px">الكنز الحقيقي ليس في الصندوق… بل في المعرفة التي اكتسبناها!</p><p>عرفتم منازل الأعداد، ومثلتم القيمة المكانية، وفككتم الشفرات، وكتبتم الصيغ التحليلية.</p><p><b>أحسنتم يا أبطال قلعة نزوى!</b></p></div><hr><h3>🌱 أقيّم تعلمي</h3><p>أستطيع تحديد المنازل وكتابة الصيغة التحليلية:</p>${['بمفردي','بمساعدة بسيطة','أحتاج إلى تدريب إضافي'].map(x=>`<label class="opt"><input type="radio" name="self" ${state.self===x?'checked':''} onchange="state.self='${x}';save()">${x}</label>`).join('')}<div class="row" style="margin-top:17px">${button('📝 الواجب المنزلي – من حياتنا','homework()')}${button('📋 سجل الملاحظة الفردية','record()','outline')}</div>`)}`)}
const pupils=['البنات – التلميذة ١','البنات – التلميذة ٢','البنات – التلميذة ٣','الأولاد – التلميذ ١','الأولاد – التلميذ ٢','الأولاد – التلميذ ٣'];function record(){show(`${nav()}${panel('📋 سجل التقويم الفردي – ستة تلاميذ',`<p class="sub">في كل محطة: «مستقل» تعني إجابة صحيحة دون مساعدة، «بمساعدة» تعني النجاح بعد تلميح، و«يحتاج إلى تدريب» تعني أن المهارة لم تتقن بعد.</p><div class="grid g2">${pupils.map((p,i)=>`<div class="group"><h3>${p}</h3>${minis.map((m,j)=>`<p><small>${m.title}</small><br><select class="field" style="font-size:15px;padding:9px" onchange="state.individual['${i}-${j}']=this.value;save()"><option value="">لم يُرصد بعد</option>${['مستقل','بمساعدة','يحتاج إلى تدريب'].map(x=>`<option ${state.individual[i+'-'+j]===x?'selected':''}>${x}</option>`).join('')}</select></p>`).join('')}</div>`).join('')}</div><div class="row" style="margin-top:20px">${button('📋 نسخ سجل التقويم','copyRecord()')}${button('خريطة البوابات','home()','outline')}</div>`)}`)}function copyRecord(){let s=pupils.map((p,i)=>p+'\n'+minis.map((m,j)=>m.title+': '+(state.individual[i+'-'+j]||'لم يرصد')).join('\n')).join('\n\n');if(navigator.clipboard?.writeText){navigator.clipboard.writeText(s).then(()=>toast('تم نسخ السجل'),()=>fallbackCopy(s))}else fallbackCopy(s)}function fallbackCopy(s){let el=document.createElement('textarea');el.value=s;document.body.appendChild(el);el.select();try{document.execCommand('copy');toast('تم نسخ السجل')}catch(e){toast('تعذر النسخ')}el.remove()}
function homework(){show(`${nav()}<div class="panel noprint"><h2 class="title">📝 تعلم ذاتي من حياتنا</h2><p>واجب منزلي يربط القيمة المكانية بأرقام السيارات في سلطنة عُمان. اطبعي بطاقة A6 مستقلة لكل تلميذ.</p><div class="row">${button('🖨️ اطبع البطاقة A6','window.print()')}${button('🏰 العودة إلى القلعة','home()','outline')}</div></div><div class="homework" id="hw"><h2>🌴 تعلم ذاتي – من حياتنا 🇴🇲</h2><p><b>اسمي:</b> __________________</p><p>ابحث مع أسرتك عن <b>الجزء الرقمي</b> من رقم لوحة سيارة عائلتكم. إذا زاد عن أربع خانات، استخدم آخر أربع خانات منه. ولا تكتب حروف اللوحة.</p><div class="hwrow"><b>أرقام لوحة السيارة:</b> <span class="line"></span></div><h3 style="text-align:center;color:var(--wine)">لوحة القيمة المكانية</h3><div class="places">${names.map(n=>`<div class="place"><b>${n}</b><strong>&nbsp;</strong></div>`).join('')}</div><div class="hwrow"><b>الصيغة التحليلية:</b><small style="display:block">من اليمين: الآحاد ثم العشرات ثم المئات ثم الآلاف. اكتب الصفر إن وجد.</small><div style="border:2px solid #e3bfa1;height:54px;border-radius:10px;margin-top:9px"></div></div><h3 style="color:var(--green)">✅ أقيّم نفسي</h3><div class="checklist"><label>☐ قرأت العدد بصورة صحيحة.</label><label>☐ وضعت الأرقام في منازلها الصحيحة.</label><label>☐ كتبت الصيغة التحليلية.</label></div><p style="text-align:center;color:var(--wine)">🏰 إعداد: أ. بسمة البدري</p></div>`) }function resetGame(){if(!confirm('هل تريد إعادة المغامرة وحذف المفاتيح ونتائج التقويم المخزنة على هذا الجهاز؟'))return;try{localStorage.removeItem('nizwaAdventureV5')}catch(e){}location.reload()}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}home();
</script></body></html>
